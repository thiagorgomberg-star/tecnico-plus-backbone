# Gera o APK do app do técnico e publica como release do GitHub.
# Só roda quando solicitado (Actions > APK Android > Run workflow), não a cada push.
# Link fixo da versão mais recente:
#   https://github.com/thiagorgomberg-star/tecnico-plus-backbone/releases/latest/download/tecnico-plus.apk
name: APK Android

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Dependências
        run: npm ci

      - name: Número da versão
        working-directory: apps/mobile
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json"));
            app.expo.version = "1.0.${{ github.run_number }}";
            app.expo.android.versionCode = ${{ github.run_number }};
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          '

      - name: Projeto Android (expo prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK
        working-directory: apps/mobile/android
        env:
          # O app compara este número com a última release para avisar de atualização.
          EXPO_PUBLIC_VERSAO_APP: ${{ github.run_number }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk tecnico-plus.apk
          gh release create "apk-${{ github.run_number }}" tecnico-plus.apk \
            --title "Técnico Plus - versão ${{ github.run_number }}" \
            --notes "APK gerado do commit ${{ github.sha }}. Instale no Android permitindo 'fontes desconhecidas'." \
            --latest
