# Backup semanal no Google Drive: toda segunda às 06h (Brasília) guarda a semana anterior em
# "Backup Técnico Plus/<semana>" com o banco completo (zip), uma subpasta por O.S. atendida
# (fotos, relatório PDF, KMZ, dados) e os demais arquivos enviados na semana.
# Segredos: SUPABASE_SERVICE_ROLE_KEY (Supabase > Project Settings > API Keys) e GDRIVE_TOKEN (saída do "rclone authorize drive").
# Para refazer uma semana: Actions > Backup semanal > Run workflow, informando uma data dela.
name: Backup semanal

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      semana:
        description: Qualquer data da semana (AAAA-MM-DD). Em branco = semana anterior.
        required: false
        default: ""

concurrency:
  group: backup-semanal
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
      SEMANA: ${{ github.event.inputs.semana }}
      SAIDA: backup-saida
      PASTA_DRIVE: Backup Técnico Plus
    steps:
      - name: Segredos configurados?
        run: |
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || { echo "::error::Falta o segredo SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          [ -n "$GDRIVE_TOKEN" ] || { echo "::error::Falta o segredo GDRIVE_TOKEN"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: |
          npm ci
          npm i --no-save tsx@4.19.2 playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Monta a pasta da semana
        run: npx tsx scripts/backup/backup.ts

      - name: Compacta o banco
        run: |
          NOME=$(cat "$SAIDA/nome-da-semana.txt")
          cd "$SAIDA/$NOME"
          zip -qr banco-completo.zip banco && rm -rf banco
          du -sh .

      - name: Envia para o Google Drive
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone config create gdrive drive scope=drive token="$GDRIVE_TOKEN" --non-interactive >/dev/null
          NOME=$(cat "$SAIDA/nome-da-semana.txt")
          rclone copy "$SAIDA/$NOME" "gdrive:$PASTA_DRIVE/$NOME" --transfers 4 --stats-one-line --stats 30s
          echo "Backup enviado: $PASTA_DRIVE/$NOME"
